import org.gradle.BuildResult
import org.gradle.StartParameter
import org.gradle.api.logging.configuration.ShowStacktrace
import org.gradle.internal.os.OperatingSystem

/**
 * Re-runs the same Gradle invocation when Unimined/Mojang metadata flakes during
 * configuration, or when Unimined mapping caches are corrupt during remapJar.
 */

ext.deepMessages = { Throwable failure ->
    def parts = []
    def current = failure
    while (current != null) {
        if (current.message != null) {
            parts << current.message
        }
        current = current.cause
    }
    return parts.join(' | ')
}

ext.isUniminedFlakyFailure = { Throwable failure ->
    def text = deepMessages(failure)
    if (text.containsIgnoreCase('Failed to get metadata')
        || text.containsIgnoreCase('no version found for')
        || text.containsIgnoreCase('minecraft config never applied')
        || text.containsIgnoreCase('MalformedJsonException')) {
        return true
    }
    def mentionsUniminedCache = text.contains('.gradle/unimined')
        || text.contains('.gradle\\unimined')
        || text.containsIgnoreCase('srg2mcp.jar')
    if (mentionsUniminedCache) {
        if (text.containsIgnoreCase('Error reading file')
            || text.containsIgnoreCase('ZipException')
            || text.containsIgnoreCase('EOFException')
            || text.containsIgnoreCase('invalid CEN header')
            || text.containsIgnoreCase('Not a valid zip file')
            || text.containsIgnoreCase('Unexpected end of ZLIB')
            || text.containsIgnoreCase('Failed to remap')) {
            return true
        }
    }
    return text.containsIgnoreCase(':remapJar')
        && (text.containsIgnoreCase('unimined') || text.containsIgnoreCase('srg2mcp'))
}

ext.readChronosRetryMax = {
    def env = System.getenv('CHRONOS_GRADLE_RETRY_MAX')
    if (env != null) {
        def parsed = env as Integer
        if (parsed != null) {
            return Math.max(1, Math.min(10, parsed))
        }
    }
    def propsFile = new File(rootDir, 'gradle.properties')
    if (propsFile.isFile()) {
        propsFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('chronos.gradle.retry.max=')) {
                def parsed = trimmed.substring(trimmed.indexOf('=') + 1).trim() as Integer
                if (parsed != null) {
                    return Math.max(1, Math.min(10, parsed))
                }
            }
        }
    }
    return 3
}

ext.chronosRetryAttempt = {
    def raw = System.getenv('CHRONOS_GRADLE_RETRY_ATTEMPT') ?: '0'
    def parsed = raw as Integer
    return parsed != null && parsed >= 0 ? parsed : 0
}

ext.retryBackoffMs = { int attempt ->
    if (attempt == 0) {
        return 2000L
    }
    if (attempt == 1) {
        return 5000L
    }
    return 10000L
}

ext.clearUniminedGlobalCache = {
    def cache = new File(System.getProperty('user.home'), '.gradle/unimined')
    if (cache.exists()) {
        cache.deleteDir()
        println "[Chronos] Cleared Unimined global cache: ${cache.absolutePath}"
    }
}

ext.clearUniminedLocalCaches = {
    def variantsRoot = new File(rootDir, 'variants')
    if (!variantsRoot.isDirectory()) {
        return
    }
    variantsRoot.eachDir { groupDir ->
        groupDir.eachDir { projectDir ->
            def local = new File(projectDir, '.gradle/unimined')
            if (local.exists()) {
                local.deleteDir()
                println "[Chronos] Cleared Unimined local cache: ${local.absolutePath}"
            }
        }
    }
}

ext.clearUniminedCaches = {
    clearUniminedGlobalCache()
    clearUniminedLocalCaches()
}

ext.buildGradleRetryArgs = { StartParameter startParameter ->
    // ProcessBuilder requires java.lang.String elements; Groovy GStrings are not accepted.
    def cmd = [] as List<String>
    if (!startParameter.isBuildCacheEnabled()) {
        cmd << '--no-build-cache'
    }
    if (startParameter.showStacktrace == ShowStacktrace.ALWAYS) {
        cmd << '--stacktrace'
    } else if (startParameter.showStacktrace == ShowStacktrace.ALWAYS_FULL) {
        cmd << '--full-stacktrace'
    }
    if (startParameter.isOffline()) {
        cmd << '--offline'
    }
    if (startParameter.isRefreshDependencies()) {
        cmd << '--refresh-dependencies'
    }
    startParameter.projectProperties.each { key, value ->
        cmd << "-P${key}=${value}".toString()
    }
    startParameter.systemPropertiesArgs.each { key, value ->
        cmd << "-D${key}=${value}".toString()
    }
    startParameter.taskNames.each { task ->
        cmd << task.toString()
    }
    return cmd
}

gradle.buildFinished { BuildResult result ->
    def failure = result.failure
    if (failure == null) {
        return
    }
    if (!isUniminedFlakyFailure(failure)) {
        return
    }

    def attempt = chronosRetryAttempt()
    def maxAttempts = readChronosRetryMax()
    if (attempt >= maxAttempts - 1) {
        println "[Chronos] Unimined failure persists after ${attempt + 1} attempt(s). " +
            'Try: ./gradlew cleanUniminedCache then rebuild, or set chronos.gradle.retry.max higher.'
        return
    }

    def nextAttempt = attempt + 1
    def delayMs = retryBackoffMs(attempt)
    def firstLine = failure.message?.readLines()?.find { it } ?: ''
    println "[Chronos] Flaky Unimined build (${attempt + 1}/${maxAttempts}): ${firstLine}"
    println "[Chronos] Clearing Unimined caches and retrying the same Gradle command in ${delayMs}ms..."
    Thread.sleep(delayMs)
    clearUniminedCaches()

    def wrapper = new File(rootDir, OperatingSystem.current().isWindows() ? 'gradlew.bat' : 'gradlew')
    if (!wrapper.isFile()) {
        println "[Chronos] Cannot retry: missing ${wrapper.absolutePath}"
        return
    }

    def command = [] as List<String>
    command << wrapper.absolutePath
    command.addAll(buildGradleRetryArgs(gradle.startParameter))

    def pb = new ProcessBuilder(command)
    pb.directory(rootDir)
    pb.redirectErrorStream(true)
    pb.environment().putAll(System.getenv())
    pb.environment().put('CHRONOS_GRADLE_RETRY_ATTEMPT', nextAttempt.toString())
    def process = pb.start()

    def output = process.inputStream.getText('UTF-8')
    if (output) {
        print output
    }
    def exit = process.waitFor()
    if (exit == 0) {
        println "[Chronos] Gradle retry succeeded on attempt ${nextAttempt + 1}."
    } else {
        println "[Chronos] Gradle retry failed with exit code ${exit}."
    }
    Runtime.runtime.halt(exit)
}
