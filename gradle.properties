# Global Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2

# Re-run ./gradlew on flaky Unimined metadata or corrupt mapping caches (see gradle/chronos-unimined-retry.gradle).
chronos.gradle.retry.max=3

# Central mod metadata (single source of truth for human-facing strings)
chronos.mod.version=1.1.0
chronos.mod.id=chronosbackups
chronos.mod.name=Chronos Backups
chronos.mod.author=MagicJinn
chronos.mod.group=com.magicjinn.chronos
chronos.mod.license=MIT
chronos.mod.description=A multi-loader Minecraft backup utility. Designed to save the most important parts of your world, keeping backups smaller.

# Core: authored with JDK 25, bytecode targets older JVMs for loader compatibility
chronos.core.java.release=8

# Night Config (TOML) - explicit on Fabric/Forge. NeoForge already ships compatible artifacts on the classpath.
chronos.nightconfig.version=3.6.7

# Google Drive / OAuth (Versions chosen to have compatible bytecode)
chronos.google.api.client.version=2.7.2
chronos.google.oauth.client.version=1.36.0
chronos.google.api.services.drive.version=v3-rev20230822-2.0.0
# Transitives Loom/Forge must nest explicitly (include/jarJar/chronosEmbedded do not pull them).
chronos.google.http.client.version=1.45.2
chronos.google.auth.library.version=1.30.0

# Build tooling
loom.version=1.14.10
neoforge.moddev.plugin.version=2.0.141
paperweight.userdev.version=2.0.0-beta.21
run.paper.version=3.0.2
unimined.version=1.4.1
