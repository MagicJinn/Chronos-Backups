import java.util.Properties

plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

def rootProps = new Properties()
file('../gradle.properties').withReader('UTF-8') { rootProps.load(it) }

group = rootProps.getProperty('chronos.mod.group')
version = rootProps.getProperty('chronos.mod.version')

base {
    // Single Forge jar; compiled/remapped against pinned Minecraft + Forge below.
    archivesName = 'chronos-backup-forge-line-1_12'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

unimined.useGlobalCache = true

repositories {
    mavenCentral()
    maven { url = 'https://maven.wagyourtail.xyz/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        searge()
        mcp 'stable', '39-1.12'
    }

    minecraftForge {
        loader '14.23.5.2864'
    }

    defaultRemapJar = true
}

sourceSets.main.java.srcDirs(
    file('../core/src/main/java'),
    file('../shell-shared/src/main/java'),
    file('../shell-forge/src/main/java'),
)

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', rootProps.getProperty('chronos.mod.id')
    inputs.property 'mod_name', rootProps.getProperty('chronos.mod.name')
    inputs.property 'mod_description', rootProps.getProperty('chronos.mod.description')
    inputs.property 'mod_author', rootProps.getProperty('chronos.mod.author')
    from(rootProject.file('icon.png')) {
        into ''
    }
    filesMatching('mcmod.info') {
        expand(
                'version': project.version,
                'mod_id': rootProps.getProperty('chronos.mod.id'),
                'mod_name': rootProps.getProperty('chronos.mod.name'),
                'mod_description': rootProps.getProperty('chronos.mod.description'),
                'mod_author': rootProps.getProperty('chronos.mod.author')
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
