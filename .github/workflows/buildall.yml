name: Build All

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.html"
      - "**/*.css"
      - "tooling/publish/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.html"
      - "**/*.css"
      - "tooling/publish/**"

jobs:
  build-rust-host-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build host native rust-pruner
        shell: bash
        run: ./gradlew buildRust --no-daemon
        env:
          CHRONOS_VARIANT_GENERATION: "skip"

      - name: Upload host native rust-pruner output
        uses: actions/upload-artifact@v4
        with:
          name: rust-pruner-host-native-${{ matrix.os }}
          path: core/native/rust-pruner/target/*/release/*
          if-no-files-found: error

  build-all:
    needs: build-rust-host-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle

      - name: Download rust native artifacts from all OS jobs
        uses: actions/download-artifact@v4
        with:
          pattern: rust-pruner-host-native-*
          merge-multiple: true
          path: core/native/rust-pruner/target

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate variant projects
        run: ./gradlew generateVariants --no-daemon
        env:
          CHRONOS_VARIANT_GENERATION: "skip"

      - name: Run buildAll
        run: ./gradlew buildAll -PchronosRustSkipBuild=true -PchronosRustRequireAllTargets=false --no-daemon

      - name: Verify Google Drive jar packaging
        run: ./gradlew verifyGoogleDriveJarContents -PchronosRustSkipBuild=true --no-daemon

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: chronos-build-jars
          path: build/libs/*.jar
          if-no-files-found: error
