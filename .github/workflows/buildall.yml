name: Build All

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "*.html"
      - "**/*.html"
      - "*.css"
      - "**/*.css"
      - "tooling/publish/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "*.html"
      - "**/*.html"
      - "*.css"
      - "**/*.css"
      - "tooling/publish/**"

jobs:
  build-rust-host-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build host native rust-pruner
        shell: bash
        run: ./gradlew buildRust --no-daemon
        env:
          CHRONOS_VARIANT_GENERATION: "skip"

      - name: Upload host native rust-pruner output
        uses: actions/upload-artifact@v7
        with:
          name: rust-pruner-host-native-${{ matrix.os }}
          path: core/native/rust-pruner/target/*/release/*
          if-no-files-found: error

  build-all:
    needs: build-rust-host-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle

      - name: Download rust native artifacts from all OS jobs
        uses: actions/download-artifact@v8
        with:
          pattern: rust-pruner-host-native-*
          merge-multiple: true
          path: core/native/rust-pruner/target

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate variant projects
        run: ./gradlew generateVariants --no-daemon
        env:
          CHRONOS_VARIANT_GENERATION: "skip"

      - name: Run buildAll
        run: ./gradlew buildAll -PchronosRustSkipBuild=true -PchronosRustRequireAllTargets=false --no-daemon

      - name: Verify linux-aarch64 rust-pruner is packaged
        run: |
          test -f build/generated/rust-pruner-resources/natives/linux-aarch64/librust_pruner.so
          fabric_jar=$(ls build/libs/chronosbackups-*-fabric.jar 2>/dev/null | head -1)
          test -n "$fabric_jar"
          unzip -l "$fabric_jar" | grep -F 'natives/linux-aarch64/librust_pruner.so'

      - name: Verify Google Drive jar packaging
        run: ./gradlew verifyGoogleDriveJarContents -PchronosRustSkipBuild=true --no-daemon

      - name: Upload built jars
        uses: actions/upload-artifact@v7
        with:
          name: chronos-build-jars
          path: build/libs/*.jar
          if-no-files-found: error
