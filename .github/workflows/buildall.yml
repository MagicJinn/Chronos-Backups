name: Build All

on:
  push:
  pull_request:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate variant projects
        run: ./gradlew generateVariantProjects --no-daemon
        env:
          CHRONOS_SKIP_VARIANT_AUTOGEN: "1"

      - name: Run buildAll
        run: ./gradlew buildAll
