[package]
name = "rust-pruner"
version = "1.1.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
world-test = []

[[bin]]
name = "prune-world-test"
path = "src/bin/prune_world_test.rs"
required-features = ["world-test"]

[dependencies]
mca = "2.1.2"
na_nbt = { version = "0.2.1", features = ["shared"], default-features = false }
flate2 = "1"
rayon = "1"
walkdir = "2"
jni = "0.21"
rawzip = "0.4.4"

[profile.release]
lto = "thin"
codegen-units = 1

# rustc still passes -O1 to the linker. Zig (and some other linkers) warn that this setting is deprecated. Harmless noise until rustc stops sending it
[lints.rust]
linker_messages = "allow"